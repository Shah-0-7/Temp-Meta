name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Same flag Cloudflare uses: fails if pnpm-lock.yaml is out of date.
      - run: pnpm install --frozen-lockfile

      # Builds the engine, server and web app. Each runs the TypeScript compiler, so this is the type check.
      - run: pnpm build

      - run: pnpm test

      # Informational for now: the project has not been linted in CI before.
      - run: pnpm lint
        continue-on-error: true
